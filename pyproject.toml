[project]
name = "moss-tts"
description = "ComfyUI custom nodes for OpenMOSS MOSS-TTS v1.5 — three variants: Local-Transformer (Qwen3-4B backbone, 48 kHz stereo), Delay (8B, 24 kHz) and VoiceGenerator (1.7B, 24 kHz, voice design). Reference-free TTS, zero-shot voice cloning, continuation, duration control, 31 languages."
version = "0.1.2"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
  "huggingface-hub",
  "safetensors",
  "numpy",
  "tqdm",
]

[project.urls]
Repository = "https://github.com/CloudRipple/MOSS-TTS-ComfyUI"
Model = "https://huggingface.co/OpenMOSS-Team/MOSS-TTS-Local-Transformer-v1.5"
Model-8B = "https://huggingface.co/OpenMOSS-Team/MOSS-TTS-v1.5"

[tool.comfy]
PublisherId = "cloudripple"  # registered at https://registry.comfy.org
DisplayName = "MOSS-TTS"
Icon = ""
